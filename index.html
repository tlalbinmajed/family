<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123c32" />
    <meta name="description" content="الأرشيف الرقمي التفاعلي لشجرة عائلة حدارى عفيف" />
    <title>أبناء سالم الحداري - ع | شجرة حدارى عفيف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="family-header">
        <div class="brand-mark" aria-hidden="true">ح</div>
        <div>
          <p class="eyebrow">أبناء سالم الحداري - ع</p>
          <h1>شجرة حدارى عفيف</h1>
        </div>
      </header>

      <section class="stats-banner" aria-label="إحصائيات أفراد العائلة">
        <div class="stats-main">
          <span class="stats-number" id="totalCount">—</span>
          <span class="stats-label">إجمالي أفراد العائلة</span>
        </div>
        <div class="stats-split">
          <span><i class="status-dot living-dot"></i><strong id="livingCount">—</strong> حيًا</span>
          <span><i class="status-dot deceased-dot"></i><strong id="deceasedCount">—</strong> متوفين</span>
        </div>
      </section>

      <section class="workspace" aria-label="مستكشف شجرة العائلة">
        <div class="tool-panel">
          <div class="search-wrap">
            <label for="familySearch">ابحث في أفراد العائلة</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
              <input id="familySearch" type="search" autocomplete="off" placeholder="مثال: ثامر، عبدالله، محمد" />
              <button id="clearSearch" class="icon-button clear-search" type="button" aria-label="مسح البحث" hidden>×</button>
            </div>
            <div id="searchResults" class="search-results" role="listbox" aria-label="نتائج البحث" hidden></div>
          </div>

          <div class="tree-actions" aria-label="أدوات الشجرة">
            <div class="action-group">
              <button id="expandAll" class="text-button" type="button">فتح الكل</button>
              <button id="collapseAll" class="text-button" type="button">إغلاق الكل</button>
            </div>
            <div class="action-group zoom-group">
              <button id="zoomIn" class="icon-button" type="button" aria-label="تكبير الشجرة">+</button>
              <button id="zoomOut" class="icon-button" type="button" aria-label="تصغير الشجرة">−</button>
              <button id="resetView" class="text-button" type="button">إعادة الضبط</button>
            </div>
          </div>

          <nav id="breadcrumb" class="breadcrumb" aria-label="مسار الشخص المحدد">
            <span>اختر شخصًا لعرض مساره</span>
          </nav>
        </div>

        <div id="treeViewport" class="tree-viewport" tabindex="0" aria-label="شجرة العائلة، اسحب للتحريك واستخدم الأزرار للتكبير">
          <div id="treeTransform" class="tree-transform">
            <div id="treeCanvas" class="tree-canvas">
              <svg id="connectors" class="connectors" aria-hidden="true"></svg>
              <div id="familyTree" class="family-tree"></div>
            </div>
          </div>
          <p class="gesture-hint">اسحب للتحريك • قرّب بإصبعين للتكبير</p>
        </div>
      </section>

      <footer>
        <span>أرشيف عائلي رقمي</span>
        <span id="validationStatus">جارٍ التحقق من البيانات…</span>
      </footer>
    </main>
    <script src="./familyData.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
